<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Ervinna Jawak">

    <title>Contact - Ervinna Jawak</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- NAVBAR -->
    <header class="bg-blue-600 text-white shadow-md">

        <nav class="container mx-auto px-6 py-4
                    flex flex-col md:flex-row
                    justify-between items-center">

            <!-- Nama -->
            <h1 class="text-2xl font-bold mb-3 md:mb-0">
                Ervinna Jawak
            </h1>

            <!-- Menu -->
            <div class="flex flex-wrap justify-center gap-4">

                <a href="index.html" class="hover:text-blue-200">
                    Home
                </a>

                <a href="about.html" class="hover:text-blue-200">
                    About
                </a>

                <a href="projects.html" class="hover:text-blue-200">
                    Projects
                </a>

                <a href="contact.html"
                   class="text-blue-200 font-bold">
                    Contact
                </a>

                <a href="javascript.html" class="hover:text-blue-200">
                    JavaScript
                </a>

            </div>

        </nav>

    </header>


    <!-- MAIN -->
    <main class="container mx-auto px-6 py-12">

        <section class="max-w-2xl mx-auto">

            <!-- Judul -->
            <div class="text-center mb-10">

                <h2 class="text-4xl font-bold text-blue-600 mb-4">
                    Contact Me
                </h2>

                <p class="text-gray-600">
                    Silakan hubungi saya melalui form berikut.
                </p>

            </div>


            <!-- FORM -->
            <form class="bg-white p-8 rounded-2xl shadow-md">

                <!-- Nama -->
                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Nama
                    </label>

                    <input
                        type="text"
                        placeholder="Masukkan nama"
                        class="w-full border border-gray-300
                               rounded-lg px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                </div>


                <!-- Email -->
                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Masukkan email"
                        class="w-full border border-gray-300
                               rounded-lg px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                </div>


                <!-- Pesan -->
                <div class="mb-6">

                    <label class="block font-semibold mb-2">
                        Pesan
                    </label>

                    <textarea
                        rows="5"
                        placeholder="Tulis pesan..."
                        class="w-full border border-gray-300
                               rounded-lg px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500"></textarea>

                </div>


                <!-- Tombol -->
                <button
                    type="submit"
                    class="w-full bg-blue-600
                           text-white py-3
                           rounded-lg
                           hover:bg-blue-700
                           font-semibold">

                    Kirim Pesan

                </button>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="bg-blue-600 text-white
                   text-center py-6 mt-10">

        <p>
            &copy; 2026 Ervinna Jawak.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
